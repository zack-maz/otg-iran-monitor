<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iran Monitor</title>

    <!-- Phase 41 Plan 06 (REVEAL-SITE-03) — static OG/Twitter/description meta.
      Crawlers read raw HTML (no SSR); absolute vercel.app URLs are mandatory
      (D-09). og:image is the Plan-04 og-card.png at its SERVED path
      (/screenshots/..., Vite strips the public/ prefix), 1200x630. -->
    <meta
      name="description"
      content="A real-time intelligence dashboard for the Iran conflict — live flights, ships, conflict events, and infrastructure on a 2.5D map, fed by a dozen public data sources. Numbers over narratives."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Iran Monitor — Real-time conflict intelligence dashboard" />
    <meta
      property="og:description"
      content="Live flights, ships, conflict events, and infrastructure on a 2.5D map, fed by a dozen public data sources. Numbers over narratives."
    />
    <meta property="og:url" content="https://motg-iran.vercel.app/" />
    <meta property="og:image" content="https://motg-iran.vercel.app/screenshots/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Iran Monitor — Real-time conflict intelligence dashboard" />
    <meta
      name="twitter:description"
      content="Live flights, ships, conflict events, and infrastructure on a 2.5D map, fed by a dozen public data sources. Numbers over narratives."
    />
    <meta name="twitter:image" content="https://motg-iran.vercel.app/screenshots/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
