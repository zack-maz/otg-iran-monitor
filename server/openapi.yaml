openapi: 3.0.3

info:
  title: Iran Monitor API
  version: 1.0.0
  description: |
    Real-time intelligence API for monitoring Iran conflict data.

    All `/api/*` data endpoints follow a common cache-first pattern and return a
    `CacheResponse<T>` envelope containing the `data` payload, a `stale` flag,
    and `lastFresh` timestamp. Upstream failures degrade gracefully: the server
    falls back to the most recent cached data (with `stale: true`) instead of
    propagating the error when possible.

    All error responses use a consistent envelope:
    ```
    { "error": string, "code": string, "statusCode": number, "requestId"?: string, "stack"?: string }
    ```

    Each `/api/*` endpoint has its own sliding-window rate limit applied per
    client IP. See `server/middleware/rateLimit.ts` for the per-endpoint limits
    and rationale.
  contact:
    name: Iran Monitor
    url: https://github.com/zack-maz/otg-iran-monitor
  license:
    name: Private
    url: https://example.com/license

servers:
  - url: https://otg-iran-monitor.vercel.app
    description: Production (Vercel serverless)
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Flights
    description: Live ADS-B flight telemetry around Iran.
  - name: Ships
    description: AIS ship position data (AISStream.io).
  - name: Events
    description: Conflict events from GDELT with CAMEO classification.
  - name: News
    description: Conflict-relevant news clusters from GDELT DOC and RSS feeds.
  - name: Markets
    description: Oil & energy market quotes (Yahoo Finance).
  - name: Weather
    description: Open-Meteo weather grid covering the Middle East.
  - name: Sites
    description: Infrastructure sites (OpenStreetMap via Overpass).
  - name: Water
    description: Water infrastructure with WRI Aqueduct stress indicators.
  - name: Geocode
    description: Reverse geocoding via Nominatim.
  - name: Sources
    description: Runtime data source configuration status.
  - name: Health
    description: Service health probes (unauthenticated, degrade-open).
  - name: Operator
    description: |
      Operator-tier endpoints surfacing pipeline observability, audit logs,
      and dev-only diff replays. Bearer-gated via `operatorBearer`
      (DASHBOARD_PASSWORD) in production; dev bypasses auth.
  - name: Cron
    description: |
      Vercel-cron scheduled endpoints (`/api/cron/*`). Bearer-gated via
      `cronSecret` (CRON_SECRET) when configured; empty CRON_SECRET
      preserves un-authed dev behavior. Hobby cap is 3 cron entries.

paths:
  # ---------- Flights ----------
  /api/flights:
    get:
      summary: Get live flight data
      description: |
        Returns live ADS-B flight telemetry filtered to the Middle East bounding
        box. Results are served from Redis cache when fresh; on upstream errors
        the server falls back to stale cache.

        `source=opensky` requires `OPENSKY_CLIENT_ID` + `OPENSKY_CLIENT_SECRET`
        environment variables. `adsblol` is the default (free, no auth).
      tags: [Flights]
      parameters:
        - name: source
          in: query
          required: false
          description: Flight data provider.
          schema:
            type: string
            enum: [opensky, adsblol]
            default: adsblol
      responses:
        '200':
          description: Cache response with flight entities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FlightEntity'
                      rateLimited:
                        type: boolean
                        description: Present and true when served from cache due to upstream 429.
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamError'

  # ---------- Ships ----------
  /api/ships:
    get:
      summary: Get live ship data
      description: |
        Returns live ship positions from AISStream.io. The server connects,
        collects for a short window, then closes the socket (no persistent
        connection). Cached ships are merged with fresh ships by MMSI and
        pruned at a 10-minute stale threshold.
      tags: [Ships]
      responses:
        '200':
          description: Cache response with ship entities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShipEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Events ----------
  /api/events:
    get:
      summary: Get conflict events
      description: |
        Returns conflict events from GDELT v2 with CAMEO classification.
        On cache miss the server merges fresh events with cached data and may
        lazily backfill historical events since WAR_START (rate-limited by a
        1-hour cooldown stored in Redis).
      tags: [Events]
      parameters:
        - name: backfill
          in: query
          required: false
          description: Force a GDELT historical backfill (bypasses cooldown).
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Cache response with conflict event entities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConflictEventEntity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- News ----------
  /api/news:
    get:
      summary: Get conflict news clusters
      description: |
        Returns clustered news articles from GDELT DOC 2.0 and RSS feeds
        (BBC, Al Jazeera, Tehran Times, Times of Israel, Middle East Eye,
        Bellingcat). Articles are filtered by conflict keywords, deduplicated
        via Jaccard similarity, and pruned to a 7-day sliding window.
      tags: [News]
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a cache refresh (bypasses freshness check).
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Cache response with news clusters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NewsCluster'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Markets ----------
  /api/markets:
    get:
      summary: Get oil & energy market quotes
      description: |
        Returns market data for Brent Crude (BZ=F), WTI (CL=F), and energy
        equities (XLE, USO, XOM) from Yahoo Finance. Includes historical
        sparkline data for the requested range.
      tags: [Markets]
      parameters:
        - name: range
          in: query
          required: false
          description: Sparkline history range.
          schema:
            type: string
            enum: [1d, 5d, 1mo, ytd]
            default: 1d
      responses:
        '200':
          description: Cache response with market quotes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MarketQuote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  # ---------- Weather ----------
  /api/weather:
    get:
      summary: Get weather grid
      description: |
        Returns a grid of weather observations across the Middle East from
        Open-Meteo. Each grid point includes temperature (°C), wind speed
        (knots), and wind direction (degrees).
      tags: [Weather]
      responses:
        '200':
          description: Cache response with weather grid points.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WeatherGridPoint'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Sites ----------
  /api/sites:
    get:
      summary: Get infrastructure sites
      description: |
        Returns infrastructure sites (nuclear, naval, oil, airbase, port)
        across the Middle East from OpenStreetMap via the Overpass API.
        Cached for 24 hours since sites are essentially static.
      tags: [Sites]
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a cache refresh.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Cache response with infrastructure sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SiteEntity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Water facilities ----------
  /api/water:
    get:
      summary: Get water infrastructure facilities
      description: |
        Returns water infrastructure facilities (dams, reservoirs, desalination
        plants, treatment plants) with WRI Aqueduct 4.0 stress indicators
        (baseline water stress, drought risk, groundwater decline, seasonal
        variability, composite health). In production, `refresh=true` is only
        honored when the request carries a `vercel-cron` user agent.
      tags: [Water]
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a cache refresh (cron-only in production).
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Cache response with water facilities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WaterFacility'
                      filterStats:
                        type: object
                        description: Diagnostic counts from the Overpass filtering pipeline.
                        properties:
                          rawCounts:
                            type: object
                            additionalProperties:
                              type: integer
                          filteredCounts:
                            type: object
                            additionalProperties:
                              type: integer
                          rejections:
                            type: object
                            properties:
                              excluded_location:
                                type: integer
                              not_notable:
                                type: integer
                              no_name:
                                type: integer
                              duplicate:
                                type: integer
                              low_score:
                                type: integer
                          enrichment:
                            type: object
                            properties:
                              withCapacity:
                                type: integer
                              withCity:
                                type: integer
                              withRiver:
                                type: integer
                          scoreHistogram:
                            type: array
                            items:
                              type: object
                              properties:
                                bucket:
                                  type: string
                                count:
                                  type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ---------- Water precipitation ----------
  /api/water/precip:
    get:
      summary: Get water facility precipitation data
      description: |
        Returns 30-day precipitation data keyed to the currently cached water
        facility coordinates, fetched from Open-Meteo in batches. Cached for
        6 hours.
      tags: [Water]
      parameters:
        - name: refresh
          in: query
          required: false
          description: Force a cache refresh.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Cache response with precipitation data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PrecipitationData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Geocode ----------
  /api/geocode:
    get:
      summary: Reverse geocode a coordinate
      description: |
        Returns a human-readable place name for a latitude/longitude pair via
        Nominatim. Coordinates are quantized to 2 decimal places before cache
        lookup to maximize hit rate. Results cached 30 days (logical) / 90 days
        (hard Redis TTL).
      tags: [Geocode]
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude (-90 to 90).
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          description: Longitude (-180 to 180).
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Cache response with geocoded location.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CacheResponseBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GeocodedLocation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- Sources ----------
  /api/sources:
    get:
      summary: Get data source configuration
      description: |
        Returns a lightweight status object indicating which flight providers
        have their credentials configured on the server. Used by the frontend
        StatusPanel to gate the source selector.
      tags: [Sources]
      responses:
        '200':
          description: Source configuration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConfig'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ---------- Health ----------
  /health:
    get:
      summary: Service health check
      description: |
        Pings Redis and reports per-source cache freshness. This endpoint is
        not rate-limited and is excluded from access logging to reduce noise.
      tags: [Health]
      responses:
        '200':
          description: Health payload with Redis status and per-source freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'

  # ---------- Operator (Phase 36 D-05) ----------
  /api/audit-status:
    get:
      summary: Production-connectivity audit result (degrade-open).
      description: |
        Surfaces the latest result from `.github/workflows/prod-connectivity-audit.yml`.
        Reads Redis key `audit:connectivity:last-result` (7d TTL).

        **No auth gate** — operator-tier metadata only (no PII / secrets);
        the existing per-endpoint global rate limit (60/min) protects
        against abuse. See `server/routes/audit-status.ts` for the
        degrade-open contract: Redis errors or parse failures return
        `{status: 'absent'}` (HTTP 200), NEVER 500.

        Sets `X-Audit-Stale: true` header when the run is older than 7 days.

        Phase 28.2 W6 / D-05.
      tags: [Operator]
      responses:
        '200':
          description: Audit result envelope (degrade-open).
          headers:
            X-Audit-Stale:
              schema:
                type: string
                enum: ['true']
              description: Set when the audit run is older than 7 days.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pass, fail, absent]
                  runId:
                    type: string
                    nullable: true
                  timestamp:
                    type: string
                    format: date-time
                    nullable: true
                  lastVerifiedAt:
                    type: string
                    format: date-time
                    nullable: true
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [pass, fail]
                  durationMs:
                    type: integer
                    minimum: 0
                    nullable: true
                  allTiersGreen:
                    type: boolean
                    nullable: true
                  tierStatus:
                    type: object
                    properties:
                      critical:
                        $ref: '#/components/schemas/AuditTierStatus'
                      nonCritical:
                        $ref: '#/components/schemas/AuditTierStatus'
                      static:
                        $ref: '#/components/schemas/AuditTierStatus'
                      probeOnly:
                        $ref: '#/components/schemas/AuditTierStatus'
                      cron:
                        $ref: '#/components/schemas/AuditTierStatus'

  /api/operator-status:
    get:
      summary: Aggregated operator dashboard payload.
      description: |
        Bearer-gated aggregator for the merged DevApiStatus API Health tab
        (Phase 28.2 W5). Aggregates rolling 24h audit-log counters,
        per-Bearer quota breakdown, adversarial-eval result, dead-URL prune
        block, and actor-quality observability into one operator surface.

        Read-only — never writes to Redis. Per-block degrade-open: any
        sub-block read failure logs a warning and returns null/empty for
        that block; the route still emits 200.
      tags: [Operator]
      security:
        - operatorBearer: []
      responses:
        '200':
          description: Aggregated operator payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit24h:
                    type: integer
                    minimum: 0
                    description: Operator-action count in the last 24h.
                  byBearer:
                    $ref: '#/components/schemas/ByBearerMap'
                  advEval:
                    type: object
                    nullable: true
                    description: 'Last adversarial-eval result (events:llm-eval-adversarial:v3 sidecar).'
                  prune:
                    type: object
                    description: Dead-URL prune block (Phase 32 Plan 04; Phase 44 D-01 fields).
                    properties:
                      deadUrlCount:
                        type: integer
                        minimum: 0
                        description: Authoritative O(1) terminal-dead total (events:url-liveness-count sidecar).
                      last24hPrunes:
                        type: integer
                        minimum: 0
                      countsByStatus:
                        type: object
                        description: >-
                          Phase 44 D-01/D-03 — SAMPLED per-status tally over the
                          events:url-liveness:* SCAN, bounded by MAX_SCAN_KEYS=200.
                          NOT authoritative (deadUrlCount is). Keys are liveness
                          statuses (live/unknown/no-url/404/403/dead-host/soft-404);
                          absent statuses are omitted (sparse map).
                        additionalProperties:
                          type: integer
                          minimum: 0
                      deadUrlSample:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          properties:
                            eventId:
                              type: string
                            url:
                              type: string
                              nullable: true
                              description: >-
                                Phase 43 D-07/CR-01 — mirrors UrlLiveness.lastUrlProbed
                                (string | null). Terminal-dead entries carry a real URL
                                by convention, but the read is a blind generic cast, so
                                the contract honestly admits null.
                            status:
                              type: string
                              enum: [dead-host, '403', '404', soft-404]
                            evidence:
                              type: string
                              nullable: true
                              description: >-
                                Phase 43 D-19 — operator-facing diagnostic string
                                (≤200 chars). Rendered as TEXT, not HTML (T-43-16).
                            lastProbedAt:
                              type: string
                              description: Phase 44 D-01 — ISO8601 last-probe timestamp.
                            attemptCount:
                              type: integer
                              minimum: 0
                              description: >-
                                Phase 44 D-01/D-02 — dead-streak depth ("dead on N
                                consecutive sweeps"); honest transition proxy.
                  actorQuality:
                    type: object
                    nullable: true
                    description: Actor-quality observability (Phase 33 Plan 06 D-16).
                  tokenBudget:
                    type: object
                    nullable: true
                    description: >-
                      Phase 39 GA-4 — provider-keyed token-budget map
                      (providers.nvidia_nim used/cap/soft/hard/state) + today's
                      cost-shadow roll-up (tokensIn/tokensOut/usd). Null on
                      degrade-open (Redis throw inside the block — T-39-03-D).
                  trendHistory:
                    type: array
                    nullable: true
                    description: >-
                      Phase 45 DASH-READ-05 (CONTEXT D-01) — bounded
                      dashboard:trends:history ring (LPUSH+LTRIM 30-cap, 30d TTL)
                      written once-daily by the existing /api/cron/health handler.
                      Up to 30 daily samples, newest-first; backs the four
                      dashboard trend sparklines (cron freshness ×3 + dead-link
                      count). Null on degrade-open (Redis throw inside the block).
                    items:
                      type: object
                      properties:
                        sampledAt:
                          type: string
                          description: ISO8601 timestamp of when the sample was taken.
                        cronAgeMs:
                          type: object
                          description: >-
                            Per-cron freshness age (ms since last successful tick)
                            at sample time. Null means the cron:lastTick:{name} key
                            was absent (degrade-open — a stalled cron reads as
                            null/stale, a valid signal, NOT a fabricated 0).
                          properties:
                            health:
                              type: integer
                              nullable: true
                            warm:
                              type: integer
                              nullable: true
                            refresh-events:
                              type: integer
                              nullable: true
                        deadUrlCount:
                          type: integer
                          minimum: 0
                          description: >-
                            events:url-liveness-count sidecar value at sample time.
                  rateLimiter:
                    type: object
                    nullable: true
                    description: >-
                      Phase 46 HARD-01 (D-01/D-02) — per-tier rate-limit config
                      (from the RATE_LIMITER_CONFIG closure mirror in
                      rateLimit.ts) plus recent 429 counts read from the
                      ratelimit:429:{tier}:{YYYY-MM-DD} sidecars (today +
                      yesterday, UTC). Backs the API Health tab rate-limiter
                      block (Plan 46-04). Null on degrade-open (Redis throw
                      inside the block — route still 200).
                    properties:
                      tiers:
                        type: array
                        description: >-
                          One entry per rate-limit tier (flights/ships/events/
                          news/markets/weather/sites/sources/geocode/water/
                          public).
                        items:
                          type: object
                          properties:
                            tier:
                              type: string
                              description: Tier name (matches the rateLimiters table key).
                            max:
                              type: integer
                              minimum: 0
                              description: Max requests per window for this tier.
                            windowSec:
                              type: integer
                              minimum: 0
                              description: Sliding-window duration in seconds.
                            recent429:
                              type: integer
                              minimum: 0
                              description: >-
                                Sum of today's + yesterday's 429 counts for this
                                tier (0 when the sidecar keys are absent).
        '401':
          description: Missing or invalid operator Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`auth_not_configured` — DASHBOARD_PASSWORD empty in production.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/llm-status:
    get:
      summary: LLM v3 pipeline observability (read-only).
      description: |
        Bearer-gated read of the LLM v3 pipeline state. Surfaces the live
        `llmProgress` singleton when active, or the Redis-backed last-run
        summary (`events:llm-summary:v3`) when idle. Phase 27.4 / 28.2.7.

        **Phase 29 D-02 framing-gap note** — the original Phase 36 plan
        documented this endpoint as `/api/events/llm-pipeline` GET + POST.
        Reality: the POST `/api/events/llm-pipeline` version-override route
        was deleted in Phase 29 D-02 part A (no writer surface), and the
        GET reader lives at `/api/events/llm-status`. The spec documents
        the shipped path. See `server/middleware/dashboardAuth.ts:12-13`
        for the deletion note and `server/routes/events.ts:345` for the
        live handler.
      tags: [Operator]
      security:
        - operatorBearer: []
      responses:
        '200':
          description: Current pipeline state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmPipelineState'
        '401':
          description: Missing or invalid operator Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`auth_not_configured` — DASHBOARD_PASSWORD empty in production.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/llm-replay/{groupKey}:
    post:
      summary: Recompute v3 enrichment for a single event group (dev-only diff, no cache write).
      description: |
        Bearer-gated. Reads existing v3 enrichment for the group, recomputes
        via the cascade with the CURRENT prompt, returns `{old, new}` diff
        WITHOUT writing to `events:llm:v3`. Phase 27.4.

        **Per-Bearer quota:** 50 calls / 24h enforced via
        `operator:replay-quota:{fingerprint}:{YYYY-MM-DD}` (48h TTL). At
        cap, returns 429 with `Retry-After` header so a compromised Bearer
        cannot drain the daily token budget within minutes
        (T-28.2-03-02 mitigation).

        **Audit:** every call appends a structured entry to
        `operator:audit-log` (SADD bounded 500 / 30d TTL) — surfaced via
        `/api/operator-status` to the API Health tab Operator Actions block.

        **Pitfall 6 contract:** read-only vs the terminal LLM cache; any
        `cacheSetSafe(LLM_EVENTS_KEY_ACTIVE, ...)` call from this handler
        would be a regression. The cron-driven extraction at
        `/api/cron/refresh-events` is the sole writer (anti-pattern #17).
      tags: [Operator]
      security:
        - operatorBearer: []
      parameters:
        - in: path
          name: groupKey
          required: true
          schema:
            type: string
            maxLength: 200
          description: Event-group identifier (deterministic hash of CAMEO + actor + date).
      responses:
        '200':
          description: Diff envelope (old vs newly-recomputed enrichment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmReplayDiff'
        '400':
          description: '`invalid_group_key` — empty, non-string, or >200 chars.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid operator Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `not_found` (groupKey not in `events:llm:v3`),
            `gdelt_cache_empty` (raw GDELT cache empty so group cannot be
            reconstructed), or `group_gone` (groupKey no longer present in
            raw GDELT). All three share this envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [not_found, gdelt_cache_empty, group_gone]
        '429':
          description: Per-Bearer quota exceeded (50/24h).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the per-Bearer quota window resets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [replay_quota_exceeded]
                  message:
                    type: string
                  resetsAt:
                    type: string
                    format: date-time
        '500':
          description: '`extract_failed` — processEventGroupsV3 threw.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [extract_failed]
                  detail:
                    type: string
                    maxLength: 200
        '503':
          description: '`auth_not_configured` — DASHBOARD_PASSWORD empty in production.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/llm-history:
    get:
      summary: LLM flight recorder — per-call + per-run history (read-only).
      description: |
        Bearer-gated read of the LLM observability flight recorder
        (Phase 39 OBS-FLIGHT). Returns `{ runs, calls }` from the
        Redis-backed recorders `llm:runs:history` (per-run summaries,
        200-cap, dedup-by-`runId`) and `llm:calls:history` (per-call rows,
        500-cap). Both degrade-open and self-hydrate from Redis on the first
        request after a Vercel Fluid-Compute cold start
        (`hydrateCallHistoryIfCold` / `hydrateRunHistoryIfCold`).

        Query params (input-validation clamps): `limit` (default 200, max
        500 — the LTRIM cap) and optional `runId` to filter the per-call
        rows to a single run. A run killed by Vercel `maxDuration` leaves
        only its `running` record — the "run that died" signal.

        Handler: `server/routes/events.ts:495`.
      tags: [Operator]
      security:
        - operatorBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
          description: Max rows per recorder (clamped to the 500 LTRIM cap).
        - in: query
          name: runId
          required: false
          schema:
            type: string
          description: Filter the per-call rows to a single run id (in-memory).
      responses:
        '200':
          description: Flight-recorder envelope (per-run summaries + per-call rows).
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                    description: Per-run summary records (RunHistoryEntry), dedup-by-runId.
                  calls:
                    type: array
                    items:
                      type: object
                    description: Per-call records (CallHistoryEntry).
        '401':
          description: Missing or invalid operator Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`auth_not_configured` — DASHBOARD_PASSWORD empty in production.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/prune-dead-urls:
    post:
      summary: Prune conflict events whose source URL has gone dead (ghost events).
      description: |
        Bearer-gated operator action (Phase 32 GHOST). Removes events whose
        primary source URL has a terminal-dead liveness status
        (404 / 403 / dead-host) from the terminal `events:llm:v3` cache and
        decrements the `events:url-liveness-count` sidecar. Over HTTP the
        `trigger` is ALWAYS `manual` (CR-01 fix) — the daily cron calls
        `pruneDeadUrlEvents({ trigger: 'cron' })` directly, never via this
        route, so an authenticated operator cannot self-record as the cron
        caller to bypass the quota.

        **Per-Bearer quota:** 50 prunes / 24h via
        `operator:prune-quota:{fingerprint}:{YYYY-MM-DD}` (D-15). At cap,
        returns 429 with a `Retry-After` header.

        **Degrade-open (Pitfall 6):** the whole handler is wrapped so any
        Redis death (quota INCR, helper SCAN, helper DEL/DECR) surfaces as a
        503 `prune_failed`, never a 500.

        Handler: `server/routes/events.ts:649`.
      tags: [Operator]
      security:
        - operatorBearer: []
      responses:
        '200':
          description: Prune result (counts of probed / pruned events).
          content:
            application/json:
              schema:
                type: object
                description: PruneResult — pruned/remaining counts + trigger.
        '401':
          description: Missing or invalid operator Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-Bearer prune quota exceeded (50/24h).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the per-Bearer prune-quota window resets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [prune_quota_exceeded]
                  message:
                    type: string
                  resetsAt:
                    type: string
                    format: date-time
        '503':
          description: |
            `prune_failed` (degrade-open under Redis death, Pitfall 6) or
            `auth_not_configured` (DASHBOARD_PASSWORD empty in production).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------- Cron (Phase 36 D-05) ----------
  /api/cron/health:
    get:
      summary: Cron health check + eval-drift folded in.
      description: |
        Detailed health probe for Vercel cron (schedule `0 0 * * *`). Pings
        Redis, reports per-source cache freshness with a 1-hour warning
        threshold, folds in the resolver-only accuracy eval
        (`runEval()`) + the adversarial sub-eval (`runAdversarialEval()`)
        per Phase 27.4.6 D-09 / Phase 28.2 Plan 03 B-2.

        Writes `cron:lastTick:health` (7d TTL) on success.

        **Verified accurate against `server/routes/cron-health.ts` as of
        Phase 36.** Drift fix inline if surfaced — none surfaced.
      tags: [Cron]
      security:
        - cronSecret: []
      responses:
        '200':
          description: Cron health payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronHealthReport'
        '401':
          description: Missing or invalid CRON_SECRET Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cron/warm:
    get:
      summary: Pre-warm Redis caches for sites + water facilities.
      description: |
        Pre-warms Redis caches for sites (`sites:v3`) and water facilities
        (`water:facilities:v4`). Called by Vercel cron every 12 hours
        (schedule `0 12 * * *`) to keep end users off cold Overpass fetches.
        Runs both fetches in parallel to fit the 60s function timeout.

        Returns `status: 'ok'` if both succeeded, `status: 'partial'` if at
        least one fulfilled (per-source `ok: false` carries the error).

        Writes `cron:lastTick:warm` (7d TTL) on partial-or-better.

        **Verified accurate against `server/routes/cron-warm.ts` as of
        Phase 36.** Drift fix inline if surfaced — none surfaced.
      tags: [Cron]
      security:
        - cronSecret: []
      responses:
        '200':
          description: Warm result summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarmResult'
        '401':
          description: Missing or invalid CRON_SECRET Bearer (when CRON_SECRET set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cron/llm-probe:
    get:
      summary: Probe candidate NVIDIA NIM models with one production-shaped batch each.
      description: |
        Sends one v3 extraction call (the real system prompt, two live GDELT
        groups from `events:gdelt`, JSON mode) to each model in `models` and
        reports HTTP status, latency, finish reason and whether the reply
        parses and passes the v3 schema. Writes nothing and bypasses the
        router, so a failing candidate cannot affect the breaker or the rate
        window.

        Exists because NIM retires free-tier models (a retired id answers 410
        on every call) and Production secrets are write-only in Vercel, so a
        replacement cannot be tried locally. With no `models` parameter the
        configured production model is probed.
      tags: [Cron]
      security:
        - cronSecret: []
      parameters:
        - in: query
          name: models
          required: false
          description: Comma-separated NIM model ids, at most 8. Repeat an id to measure it under concurrency.
          schema:
            type: string
      responses:
        '200':
          description: |
            `{ok: true, groups, results[]}`, or `{ok: false, reason}` where
            `reason` is `llm_unconfigured` or `no_raw_events`.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  reason:
                    type: string
                    enum: [llm_unconfigured, no_raw_events]
                  groups:
                    type: integer
                    description: Number of GDELT groups in the probe prompt.
                  results:
                    type: array
                    items:
                      type: object
                      required: [model, ok, latencyMs]
                      properties:
                        model:
                          type: string
                        ok:
                          type: boolean
                          description: True when the reply passed the v3 schema.
                        status:
                          type: integer
                          nullable: true
                          description: HTTP status from NIM; null on a client-side timeout.
                        latencyMs:
                          type: integer
                        finishReason:
                          type: string
                          nullable: true
                        tokensOut:
                          type: integer
                          nullable: true
                        jsonParsed:
                          type: boolean
                        schemaValid:
                          type: boolean
                        eventCount:
                          type: integer
                        error:
                          type: string
                          nullable: true
        '401':
          description: Missing or invalid CRON_SECRET Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cron/refresh-events:
    get:
      summary: Daily LLM v3 extraction cron (4am UTC) + operator force-trigger.
      description: |
        **Sole production writer** to `events:llm:v3` (anti-pattern #17:
        cron-only writer discipline). Vercel cron GETs this endpoint once per
        day (schedule `0 4 * * *`). Calls `runRefreshExtraction()` in
        `server/lib/llmExtractionPipeline.ts`.

        **Auth — CRON_SECRET only.** When `CRON_SECRET` is non-empty, the
        handler requires `Authorization: Bearer <CRON_SECRET>` via
        constant-time compare. **Framing-gap note vs Phase 36 CONTEXT
        D-06:** the original D-06 plan documented this endpoint as
        accepting EITHER `cronSecret` OR `operatorBearer` (the
        "force-trigger" path). Reality: the handler only validates
        CRON_SECRET (`server/routes/refresh-events-cron.ts:46-55`); operators
        force-triggering pass the same Bearer the cron runner uses. The
        spec documents the shipped reality.

        **`?force=true`** bypasses the 15-min cooldown sentinel
        (`events:llm-process-ts`) and the cold-cache self-heal path. Use
        cases: post-bug-fix re-extraction, post-cache-flush warm-up,
        testing during deploys.

        Writes `cron:lastTick:refresh-events` (7d TTL) AFTER
        `runRefreshExtraction` resolves (D-03 honest-failure semantics —
        a throw means the probe stays `unknown`, NOT `healthy`).

        Vercel Pro 800s `maxDuration` accommodates the ~10-min extraction
        run (Phase 29 D-08).
      tags: [Cron]
      security:
        - cronSecret: []
      parameters:
        - in: query
          name: force
          required: false
          description: When `true`, bypass the 15-min cooldown sentinel.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: |
            Extraction-run result. Returned as `{ok: true, durationMs,
            ...result}` where `result` is the `RunRefreshResult` returned
            by `runRefreshExtraction()` in `server/lib/llmExtractionPipeline.ts`.
            On dispatch: `{ok, durationMs, dispatched: true, schemaVersion: 'v3', coldCacheBypass?}`.
            On guarded skip: `{ok, durationMs, dispatched: false, reason}` where
            `reason ∈ {cooldown, llm_unconfigured, no_raw_events, pipeline_busy}`.
            Vercel cron treats any 2xx as success.
          content:
            application/json:
              schema:
                type: object
                required: [ok, durationMs, dispatched]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  durationMs:
                    type: integer
                    minimum: 0
                    description: Wall-clock duration of the dispatch decision (not the extraction itself; extraction runs fire-and-forget after return).
                  dispatched:
                    type: boolean
                    description: True when a fresh extraction was kicked off; false when one of the guarded-skip reasons applied.
                  reason:
                    type: string
                    enum:
                      - cooldown
                      - llm_unconfigured
                      - no_raw_events
                      - pipeline_busy
                    description: Populated only when `dispatched=false`; one of the four guards in `runRefreshExtraction()`.
                  coldCacheBypass:
                    type: boolean
                    description: True when the cold-cache self-heal (D-10) bypassed the cooldown sentinel so an empty `events:llm:v3` could self-heal without waiting 15 minutes.
                  schemaVersion:
                    type: string
                    enum: [v3]
                    description: Active pipeline schema at dispatch time; v3-only post-Phase-29.
        '401':
          description: Missing or invalid CRON_SECRET Bearer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            `refresh_failed` — `runRefreshExtraction` threw (NIM throttle,
            DLQ overflow, etc.). The Pitfall 1 cache bridge serves raw
            GDELT during the failure window so the map never goes blank.
          content:
            application/json:
              schema:
                type: object
                required: [ok, error, durationMs]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  error:
                    type: string
                    enum: [refresh_failed]
                  detail:
                    type: string
                    maxLength: 200
                  durationMs:
                    type: integer
                    minimum: 0

components:
  # ----------------------------------------------------------------
  # Security schemes (Phase 36 D-06)
  # ----------------------------------------------------------------
  # Two named Bearer schemes capture the machine-readable distinction
  # between the cron-secret gate (CRON_SECRET) and the operator-dashboard
  # gate (DASHBOARD_PASSWORD). README prose stays high-level; the spec
  # carries the structural distinction.
  securitySchemes:
    cronSecret:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        CRON_SECRET — Bearer used by Vercel cron invocations of `/api/cron/*`
        paths. Constant-time compared via `timingSafeEqual` in the cron
        handlers (`server/routes/cron-health.ts`, `server/routes/cron-warm.ts`,
        `server/routes/refresh-events-cron.ts`). Empty CRON_SECRET preserves
        un-authed dev behavior (matches the original cron-warm / cron-health
        surface).
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        DASHBOARD_PASSWORD — Bearer used by operator endpoints
        (`/api/operator-status`, `/api/events/llm-status`,
        `/api/events/llm-replay/:groupKey`, `/api/events/prune-dead-urls`)
        and for force-triggering `/api/cron/refresh-events?force=true` when
        an operator wants to bypass the cooldown sentinel. Constant-time
        compared via `timingSafeEqual` in `server/middleware/dashboardAuth.ts`
        (Phase 26.3+). In production with empty DASHBOARD_PASSWORD the
        middleware fail-closes with 503 `auth_not_configured`.

  # ----------------------------------------------------------------
  # Shared response templates
  # ----------------------------------------------------------------
  responses:
    ValidationError:
      description: Request query validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Invalid query: lat must be >= -90'
            code: VALIDATION_ERROR
            statusCode: 400
            requestId: 'req_abc123'

    RateLimited:
      description: Rate limit exceeded for this endpoint.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix ms timestamp when the window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Too many requests'
            code: RATE_LIMITED
            statusCode: 429

    InternalError:
      description: Unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Internal server error'
            code: INTERNAL_ERROR
            statusCode: 500
            requestId: 'req_xyz789'

    UpstreamError:
      description: Upstream data provider failure (no stale cache available).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'OpenSky credentials not configured'
            code: UPSTREAM_ERROR
            statusCode: 503

  # ----------------------------------------------------------------
  # Shared schemas
  # ----------------------------------------------------------------
  schemas:
    # -- Error envelope --
    ErrorResponse:
      type: object
      required: [error, code, statusCode]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - VALIDATION_ERROR
            - RATE_LIMITED
            - UPSTREAM_ERROR
            - INTERNAL_ERROR
            - NOT_FOUND
        statusCode:
          type: integer
          description: HTTP status code (mirrors the response status).
        requestId:
          type: string
          description: Correlation ID echoed in the `X-Request-ID` response header.
        stack:
          type: string
          description: Stack trace (only included outside production).

    # -- Cache envelope --
    CacheResponseBase:
      type: object
      required: [data, stale, lastFresh]
      properties:
        data:
          description: Payload. Shape varies per endpoint.
        stale:
          type: boolean
          description: True when served from cache beyond its logical TTL.
        lastFresh:
          type: integer
          format: int64
          description: Unix ms timestamp of the last successful upstream fetch.
        degraded:
          type: boolean
          description: True when serving from in-memory fallback because Redis is unavailable.

    # -- Entity: Flight --
    FlightEntity:
      type: object
      required: [id, type, lat, lng, timestamp, label, data]
      properties:
        id:
          type: string
          description: Stable identifier (ICAO24 hex).
        type:
          type: string
          enum: [flight]
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        timestamp:
          type: integer
          format: int64
          description: Unix ms of the position fix.
        label:
          type: string
          description: Callsign or hex code.
        data:
          type: object
          required: [icao24, callsign, originCountry, onGround, unidentified]
          properties:
            icao24:
              type: string
            callsign:
              type: string
            originCountry:
              type: string
            velocity:
              type: number
              nullable: true
              description: Ground speed (m/s).
            heading:
              type: number
              nullable: true
              description: True heading (degrees).
            altitude:
              type: number
              nullable: true
              description: Altitude (meters).
            onGround:
              type: boolean
            verticalRate:
              type: number
              nullable: true
              description: Vertical speed (m/s).
            unidentified:
              type: boolean
              description: True for hex-only (no callsign) flights, often military.

    # -- Entity: Ship --
    ShipEntity:
      type: object
      required: [id, type, lat, lng, timestamp, label, data]
      properties:
        id:
          type: string
          description: Stable identifier (derived from MMSI).
        type:
          type: string
          enum: [ship]
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        timestamp:
          type: integer
          format: int64
        label:
          type: string
        data:
          type: object
          required: [mmsi, shipName, speedOverGround, courseOverGround, trueHeading]
          properties:
            mmsi:
              type: integer
            shipName:
              type: string
            speedOverGround:
              type: number
              description: Knots.
            courseOverGround:
              type: number
              description: Degrees.
            trueHeading:
              type: number
              description: Degrees.

    # -- Entity: Conflict Event --
    ConflictEventEntity:
      type: object
      required: [id, type, lat, lng, timestamp, label, data]
      properties:
        id:
          type: string
        type:
          type: string
          description: |
            Phase 27 5-member taxonomy enforced at runtime by
            `server/schemas/cacheResponse.ts` Zod schema via `sendValidated()`
            on `/api/events`. Mirrors `server/types.ts` `ConflictEventType`
            and `docs/architecture/ontology/types.md`. The pre-Phase-27
            CAMEO-derived 11-value union (`ground_combat`, `shelling`,
            `bombing`, `assassination`, etc.) was retired with the v3 LLM
            extractor (Phase 27.4) — consumers built against the older spec
            should expect `on_ground` in place of `ground_combat` and any of
            the deprecated values to never appear.
          enum:
            - airstrike
            - on_ground
            - explosion
            - targeted
            - other
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        timestamp:
          type: integer
          format: int64
        label:
          type: string
        data:
          type: object
          required:
            [
              eventType,
              subEventType,
              fatalities,
              actor1,
              actor2,
              notes,
              source,
              goldsteinScale,
              locationName,
              cameoCode,
            ]
          properties:
            eventType:
              type: string
              description: Human-readable CAMEO description.
            subEventType:
              type: string
              description: CAMEO code label.
            fatalities:
              type: integer
            actor1:
              type: string
            actor2:
              type: string
            notes:
              type: string
            source:
              type: string
              description: Data source ("GDELT v2").
            goldsteinScale:
              type: number
              description: GDELT Goldstein conflict scale (-10 to +10).
            locationName:
              type: string
            cameoCode:
              type: string
              description: CAMEO event code (e.g. "190").
            numMentions:
              type: integer
            numSources:
              type: integer
            geoPrecision:
              type: string
              enum: [precise, centroid]
            confidence:
              type: number
              description: 0-1 composite confidence score.
            actionGeoType:
              type: integer
              description: GDELT ActionGeo_Type (1=country, 2=state, 3=city, 4=landmark).
            originalLat:
              type: number
            originalLng:
              type: number

    # -- Entity: Site --
    SiteEntity:
      type: object
      required: [id, type, siteType, lat, lng, label, osmId]
      properties:
        id:
          type: string
          description: '"site-{osmId}"'
        type:
          type: string
          enum: [site]
        siteType:
          type: string
          enum: [nuclear, naval, oil, airbase, port]
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        label:
          type: string
          description: OSM name tag.
        operator:
          type: string
          description: OSM operator tag.
        wikidata:
          type: string
          description: Wikidata QID.
        osmId:
          type: integer

    # -- Entity: WaterFacility --
    WaterFacility:
      type: object
      required: [id, type, facilityType, lat, lng, label, osmId, stress]
      properties:
        id:
          type: string
          description: '"water-{osmId}"'
        type:
          type: string
          enum: [water]
        facilityType:
          type: string
          enum: [dam, reservoir, desalination]
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        label:
          type: string
        operator:
          type: string
        osmId:
          type: integer
        stress:
          $ref: '#/components/schemas/WaterStressIndicators'
        precipitation:
          type: object
          properties:
            last30DaysMm:
              type: number
            anomalyRatio:
              type: number
            updatedAt:
              type: integer
              format: int64
        capacity:
          type: object
          properties:
            height:
              type: number
              description: Dam height in meters.
            volume:
              type: number
              description: Reservoir volume in cubic meters.
            area:
              type: number
              description: Reservoir surface area in square meters.
        nearestCity:
          type: object
          properties:
            name:
              type: string
            distanceKm:
              type: number
            population:
              type: integer
        linkedRiver:
          type: object
          properties:
            name:
              type: string
            distanceKm:
              type: number
        notabilityScore:
          type: number
          description: Holistic notability score 0-100. Higher = more strategically relevant.

    WaterStressIndicators:
      type: object
      required:
        [bws_raw, bws_score, bws_label, drr_score, gtd_score, sev_score, iav_score, compositeHealth]
      properties:
        bws_raw:
          type: number
        bws_score:
          type: number
          description: Baseline water stress normalized to 0-5.
        bws_label:
          type: string
        drr_score:
          type: number
          description: Drought risk 0-5.
        gtd_score:
          type: number
          description: Groundwater table decline 0-5.
        sev_score:
          type: number
          description: Seasonal variability 0-5.
        iav_score:
          type: number
          description: Interannual variability 0-5.
        compositeHealth:
          type: number
          description: 0 (worst) to 1 (best).

    PrecipitationData:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        last30DaysMm:
          type: number
        anomalyRatio:
          type: number

    # -- News --
    NewsCluster:
      type: object
      required: [id, primaryArticle, articles, firstSeen, lastUpdated]
      properties:
        id:
          type: string
          description: Same as primaryArticle.id.
        primaryArticle:
          $ref: '#/components/schemas/NewsArticle'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/NewsArticle'
        firstSeen:
          type: integer
          format: int64
        lastUpdated:
          type: integer
          format: int64

    NewsArticle:
      type: object
      required: [id, title, url, source, publishedAt, keywords]
      properties:
        id:
          type: string
          description: SHA-256 hash of URL (hex, truncated).
        title:
          type: string
        url:
          type: string
          format: uri
        source:
          type: string
          description: 'GDELT, BBC, Al Jazeera, Tehran Times, Times of Israel, Middle East Eye, Bellingcat.'
        sourceCountry:
          type: string
        publishedAt:
          type: integer
          format: int64
        summary:
          type: string
        imageUrl:
          type: string
          format: uri
        lat:
          type: number
        lng:
          type: number
        keywords:
          type: array
          items:
            type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        relevanceScore:
          type: number

    # -- Markets --
    MarketQuote:
      type: object
      required:
        [
          symbol,
          displayName,
          price,
          previousClose,
          change,
          changePercent,
          currency,
          marketOpen,
          lastTradeTime,
          history,
        ]
      properties:
        symbol:
          type: string
          description: 'Yahoo Finance symbol (BZ=F, CL=F, XLE, USO, XOM).'
        displayName:
          type: string
        price:
          type: number
        previousClose:
          type: number
        change:
          type: number
        changePercent:
          type: number
        currency:
          type: string
          example: USD
        marketOpen:
          type: boolean
        lastTradeTime:
          type: integer
          format: int64
        history:
          type: object
          required: [timestamps, closes, highs, lows]
          properties:
            timestamps:
              type: array
              items:
                type: integer
                format: int64
            closes:
              type: array
              items:
                type: number
            highs:
              type: array
              items:
                type: number
            lows:
              type: array
              items:
                type: number

    # -- Weather --
    WeatherGridPoint:
      type: object
      required: [lat, lng, temperature, windSpeed, windDirection]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        temperature:
          type: number
          description: Celsius.
        windSpeed:
          type: number
          description: Knots.
        windDirection:
          type: number
          description: Degrees (0-360).

    # -- Geocode --
    GeocodedLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        displayName:
          type: string
        city:
          type: string
        country:
          type: string
        countryCode:
          type: string

    # -- Sources --
    SourceConfig:
      type: object
      properties:
        opensky:
          type: object
          properties:
            configured:
              type: boolean
        adsblol:
          type: object
          properties:
            configured:
              type: boolean

    # -- Health --
    HealthReport:
      type: object
      required: [status, redis, uptime, timestamp, latencyMs, sources, estimatedDailyCommands]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        redis:
          type: boolean
        uptime:
          type: number
          description: Seconds since process start.
        timestamp:
          type: string
          format: date-time
        latencyMs:
          type: integer
          description: Redis ping round-trip time.
        sources:
          type: object
          additionalProperties:
            type: integer
            nullable: true
            description: Unix ms of last fresh fetch, or null.
        estimatedDailyCommands:
          type: integer

    CronHealthReport:
      type: object
      required: [status, redis, timestamp, sources, warnings]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        redis:
          type: boolean
        timestamp:
          type: string
          format: date-time
        sources:
          type: object
          additionalProperties:
            type: object
            properties:
              lastFresh:
                type: integer
                format: int64
                nullable: true
              stale:
                type: boolean
        warnings:
          type: array
          items:
            type: string

    WarmResult:
      type: object
      required: [status, sites, water, durationMs]
      properties:
        status:
          type: string
          enum: [ok, partial]
        sites:
          type: object
          properties:
            ok:
              type: boolean
            count:
              type: integer
            error:
              type: string
        water:
          type: object
          properties:
            ok:
              type: boolean
            count:
              type: integer
            error:
              type: string
        durationMs:
          type: integer

    # ----------------------------------------------------------------
    # Phase 36 D-07 — Reusable component schemas for new operator/cron
    # endpoints (audit-status, operator-status, llm-status, llm-replay,
    # refresh-events). Endpoint-unique shapes (e.g. llm-replay 404 envelope,
    # refresh-events skipped-vs-ran variants) stay inline at the endpoint.
    # ----------------------------------------------------------------

    AuditTierStatus:
      type: object
      description: |
        Tier-level audit status for `.github/workflows/prod-connectivity-audit.yml`
        runs. Phase 28.2 W6 / D-05. One entry per tier (`critical`,
        `nonCritical`, `static`, `probeOnly`, `cron`).
      properties:
        tier:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        evidence:
          type: object
          description: Per-tier evidence payload — shape varies by tier.
        timestamp:
          type: string
          format: date-time
      required: [tier, status]

    ByBearerMap:
      type: array
      description: |
        Per-Bearer quota counters; one entry per bearerFingerprint
        (8-char SHA-256 prefix). Phase 28.2 W3 / Phase 32 Plan 04 D-15.
        Returned by `/api/operator-status` as the `byBearer` field.
      items:
        type: object
        required: [bearerFingerprint, actions]
        properties:
          bearerFingerprint:
            type: string
            description: 8-char SHA-256 prefix of the operator's Bearer.
          actions:
            type: integer
            minimum: 0
            description: Total operator actions in the last 24h.
          swaps:
            type: integer
            minimum: 0
            description: |
              Legacy `pipeline-swap` count. Phase 29 D-02 part A deleted the
              POST `/api/events/llm-pipeline` writer; no new entries with
              this tag are produced. Field retained until the 30d audit-log
              TTL expires the last legacy entry.
          replays:
            type: integer
            minimum: 0
            description: '`/api/events/llm-replay/:groupKey` calls in the last 24h.'
          prunes:
            type: integer
            minimum: 0
            description: '`/api/events/prune-dead-urls` calls in the last 24h.'

    LlmPipelineState:
      type: object
      description: |
        LLM v3 pipeline observability surface returned by
        `GET /api/events/llm-status`. Phase 27.4 / 28.2.7 / 29.

        Phase 29 D-02 part A deleted the POST `/api/events/llm-pipeline`
        version-override route. The remaining read surface lives at
        `/api/events/llm-status`. Only the v3 cache exists
        (`events:llm:v3`); the prior `activeVersion: 'v1'|'v2'|'v3'` field
        collapses to a literal `'v3'`.

        The shape carries the in-memory `llmProgress` singleton merged with
        the Redis-backed last-run summary. Documented as `additionalProperties:
        true` because the observability surface evolves frequently and the
        gate's primary contract is the auth posture + 200/401 envelope.
      additionalProperties: true
      properties:
        stage:
          type: string
          enum: [idle, fetching, extracting, persisting, done, error]
        lastRun:
          type: object
          nullable: true
          description: Last-run summary cached at `events:llm-summary:v3`.
        schemaVersion:
          type: integer
        dlqCount:
          type: integer
        breakerState:
          type: string
          enum: [closed, open, half-open]
        routingTrace:
          type: array
          items:
            type: object

    LlmReplayDiff:
      type: object
      description: |
        Per-event-group LLM-replay diff returned by
        `POST /api/events/llm-replay/{groupKey}`. Phase 27.4.

        Read-only vs cache (T-27.4-08-05 / Pitfall 6): the handler MUST
        NOT write back to `events:llm:v3`. Operators iterate on prompt
        wording side-by-side without waiting for the full cron cycle.
      properties:
        old:
          description: |
            Existing v3 enrichment for groupKey (Redis HGET on the
            `events:llm:v3` group). Shape matches `ConflictEventEntity`.
          $ref: '#/components/schemas/ConflictEventEntity'
        new:
          type: object
          nullable: true
          description: |
            Recomputed enrichment for the same groupKey, without
            persisting. May be `null` if `processEventGroupsV3` produced
            no event for this group.
      required: [old, new]
